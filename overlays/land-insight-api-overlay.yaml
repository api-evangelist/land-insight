- target: $.components.securitySchemes.ApiKeyAuth
  update:
    description: >-
      A LandTech-issued API key sent in the X-API-Key request header. Keys are provisioned
      commercially rather than self-service; call GET /status/auth to confirm a key is active before
      issuing data requests. A 403 with user.state of expired or blocked indicates a key problem
      rather than a data-permission problem.
