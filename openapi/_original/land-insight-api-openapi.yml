              minItems: 1
              items:
                anyOf:
                  - $ref: '#/components/schemas/AdditionalOpportunities'
                    description: An optional filter for additional opportunities.
                  - $ref: '#/components/schemas/AgriculturalLandClassification'
                    description: An optional filter for agricultural land classification.
                  - $ref: '#/components/schemas/AmenitiesFilter'
                    description: An optional filter for amenities.
                  - $ref: '#/components/schemas/Article4'
                    description: >-
                      An optional filter for Article 4 constraints within
                      London.
                  - $ref: '#/components/schemas/CompanyStatus'
                    description: An optional filter for company status.
                  - $ref: '#/components/schemas/ConstraintsAdopted'
                    description: An optional filter for adopted constraints.
                  - $ref: '#/components/schemas/ConstraintsEmerging'
                    description: An optional filter for emerging constraints.
                  - $ref: '#/components/schemas/DevelopedArea'
                    description: An optional filter for developed area percentage.
                  - $ref: '#/components/schemas/GreyBeltFavourability'
                    description: An optional filter for green belt status.
                  - $ref: '#/components/schemas/LandAvailabilityAssessment'
                    description: An optional filter for land availability assessment.
                  - $ref: '#/components/schemas/LeaseEndDate'
                    description: An optional filter for lease end date.
                  - $ref: '#/components/schemas/LeaseStartDate'
                    description: An optional filter for lease start date.
                  - $ref: '#/components/schemas/OwnershipType'
                    description: An optional filter for ownership type.
                  - $ref: '#/components/schemas/ParcelSize-2'
                    description: An optional filter for parcel size in square metres.
                  - $ref: '#/components/schemas/PlanningApplications'
                    description: An optional filter for planning applications.
                  - $ref: '#/components/schemas/PowerDistance'
                    description: An optional filter for distance to nearby power sources.
                  - $ref: '#/components/schemas/ProprietorName'
                    description: An optional filter for proprietor name.
                  - $ref: '#/components/schemas/PropertyState'
                    description: An optional filter for property state.
                  - $ref: '#/components/schemas/RegionFilter'
                    description: An optional filter for region.
                  - $ref: '#/components/schemas/RegenerationZonesAdopted'
                    description: An optional filter for adopted regeneration zones.
                  - $ref: '#/components/schemas/RegenerationZonesEmerging'
                    description: An optional filter for emerging regeneration zones.
                  - $ref: '#/components/schemas/SearchLocation'
                    description: An optional filter for searching location.
                  - $ref: '#/components/schemas/SiteAllocationsAdopted'
                    description: An optional filter for adopted site allocations.
                  - $ref: '#/components/schemas/SiteAllocationsEmerging'
                    description: An optional filter for emerging site allocations.
                  - $ref: '#/components/schemas/Tenure'
                    description: An optional filter for tenure type.
                  - $ref: '#/components/schemas/UseClass'
                    description: An optional filter for use classes.
    TitleNumber:
      description: >-
        The title number is a unique identifier for registered land in England
        and Wales, governed by HM Land Registry.
      type: string
      example: WT77573
    UPRN:
      type: string
      description: >-
        Unique Property Reference Number (UPRN) is a unique numeric identifier
        for every addressable location in Great Britain, found in Ordnance
        Survey's AddressBase products.
      pattern: ^\d{1,12}$
    PlanningApplicationId:
      type: string
      description: >-
        A unique planning application ID combining a planning authority GSS code
        and the application reference, separated by a `+` symbol.
      example: E07000112+Y18/1381/FH
      pattern: ^[EWS]\d{8}(?:\+|%2B)[\w\-\/%]+$
    CoveredEntities:
      type: array
      items:
        type: object
        required:
          - id
        properties:
          id:
            type: string
          coverage:
            type: number
            description: >-
              How much of the site has been overlapped by the entity. Decimal
              ranging from 0 to 1.0
            example: 0.618
    MultiPolygon:
      description: GeoJSON MultiPolygon
      externalDocs:
        url: https://datatracker.ietf.org/doc/html/rfc7946
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - MultiPolygon
          example: MultiPolygon
          description: the geometry type
        coordinates:
          type: array
          items:
            $ref: '#/components/schemas/PolygonCoordinates'
    ParcelDetailsItem:
      type: object
      description: Parcel details. Will be `null` if the parcel is not found.
      properties:
        parcel_id:
          $ref: '#/components/schemas/ParcelId'
        parcel_size:
          type: number
          format: float
          description: The size of the parcel in square metres.
          example: 18336.97
        developed_area_ratio:
          type: number
          format: float
          description: >-
            The ratio of developed area to total parcel area. Can range from 0
            if the parcel is undeveloped, up to 1.0 when developed 100%.
          minimum: 0
          maximum: 1
          example: 0.2865
        titles:
          type: array
          description: >-
            A list of HM Land Registry title numbers associated with the parcel.
            Can be null.
          nullable: true
          items:
            $ref: '#/components/schemas/TitleNumber'
          example:
            - K375897
            - TT17693
        properties:
          type: array
          description: >
            A list of Unique Property Reference Numbers (UPRNs) formally 
            associated with a parcel title. Can be empty.
          items:
            $ref: '#/components/schemas/UPRN'
          example:
            - '50121170'
            - '50100934'
            - '10015394608'
        properties_intersects:
          type: array
          description: >
            A list of Unique Property Reference Numbers (UPRNs) that reside
            within  the title's land parcel, but are not formally associated
            with the title. Can be empty.
          items:
            $ref: '#/components/schemas/UPRN'
          example:
            - '10091868676'
            - '10023302495'
        planning_apps:
          type: array
          description: >-
            A list of planning applications associated with the parcel. Can be
            empty.
          items:
            $ref: '#/components/schemas/PlanningApplicationId'
          example:
            - E07000112+Y18/1381/FH
            - E07000112+Y10/0641/SH
        local_plan_policy:
          type: object
          description: Local policies on the parcel. Includes Local Planning Authority.
          additionalProperties:
            $ref: '#/components/schemas/CoveredEntities'
          example:
            local_planning_authority:
              - id: 35d7e882-1583-4c02-9930-a665fae9ac6e
                coverage": 1
            settlement_boundaries:
              - id: 9b58f3b3f4e0dd2dc74250da414786d5
                coverage: 0.54
            local_industrial_location:
              - id: cf056e75-5487-454f-8270-d4c60aa1fee4
                coverage: 0.43
        development_constraints:
          type: object
          description: |
            Development constraints affecting the parcel including:
              - Airport Safeguarding
              - HS2 Safeguarding
              - Rail Safeguarding
              - Building (Wharf) Safeguarding
              - Article 4 Directions
              - National Landscape Data
              - Flood Risk Zones
              - Flood Zones
              - Heritage Land / Listed Buildings
              - Conservation Areas
              - Protected Areas
              - Green Belt
              - Agricultural Land Classification
              - Neighbourhood Plan Areas
              - Rights of Way
          additionalProperties:
            $ref: '#/components/schemas/CoveredEntities'
          example:
            rail_safeguarded_land:
              - id: 1251c801-ea1c-4e74-9234-2933a38644b3
                coverage: 1
        development_opportunities:
          type: object
          description: |
            Development Opportunites including: 
              - Named Regeneration Areas
              - Area Action Plans
              - Declassified Green Belt
              - Brownfield Register
          additionalProperties:
            $ref: '#/components/schemas/CoveredEntities'
          example:
            area_action_plans:
              - id: 836cc2d8-4596-4bb6-9630-a6429c93305f
                coverage: 1
        shlaa:
          type: object
          description: >-
            Strategic Housing Land Availability Assessments applying on the
            parcel.
          additionalProperties:
            $ref: '#/components/schemas/CoveredEntities'
          example:
            shlaa_positive:
              - id: 6b3cda6f-5c0e-4415-8f4e-4b7a4b4e1574
                coverage: 1
        strategic_industrial_location:
          type: object
          description: Strategic Industrial Locations (SIL) applying on the parcel.
          additionalProperties:
            $ref: '#/components/schemas/CoveredEntities'
          example:
            strategic_industrial_location:
              - id: f6ffcea7-2fa7-48d3-b598-278090565311
                coverage: 1
        additional_opportunities:
          type: object
          description: Designated sites from Homes England Land Hub
          additionalProperties:
            $ref: '#/components/schemas/CoveredEntities'
          example:
            land_hub_on_market:
              - id: dd169de034a2de3d490e5d4c9a454460
                coverage: 1
        power:
          type: object
          description: >-
            Power infrastructure (e.g., substations, towers, cables, lines)
            located within or near the parcel.
          additionalProperties:
            type: array
            items:
              type: object
              required:
                - distance
              properties:
                id:
                  type: string
                  example: 7e47387c-8852-4265-834c-b98f5e3a222d
                distance:
                  description: >-
                    Distance of the power infrastructure unit from the parcel
                    (in meters). A distance of zero indicates that the unit is
                    located within the parcel itself.
                  type: number
                  example: 0
          example:
            hv_power_substations:
              - id: 7e47387c-8852-4265-834c-b98f5e3a222d
                distance: 0
            power_cables:
              - distance: 12.5
        renewable_energy_planning_db:
          type: object
          description: >-
            Renewable power generation projects on the parcel, sourced from
            Renewable Energy Planning Database.
          additionalProperties:
            $ref: '#/components/schemas/CoveredEntities'
          example:
            repd_solar:
              - id: fe76f6b7-f7ee-4a79-a161-66821246a68b
                coverage: 1
        geometry:
          type: object
          description: GeoJSON of the boundary of the parcel.
          oneOf:
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/MultiPolygon'
          example:
            type: MultiPolygon
            coordinates:
              - - - - 1.07466
                    - 51.07292
                  - - 1.07427
                    - 55.07204
                  - - 1.07773
                    - 55.0723
                  - - 1.07466
                    - 55.07292
    ParcelDetails:
      type: object
      properties:
        data:
          type: object
          nullable: true
          properties:
            parcel:
              $ref: '#/components/schemas/ParcelDetailsItem'
    BulkParcelRequest:
      type: object
      required:
        - parcel_ids
      properties:
        parcel_ids:
          type: array
          description: List of parcel IDs (max 50)
          maxItems: 50
          items:
            $ref: '#/components/schemas/ParcelId'
    BulkParcelResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            parcel:
              type: array
              items:
                $ref: '#/components/schemas/ParcelDetailsItem'
    BulkParcelBadRequest:
      type: object
      required:
        - error_msg
      properties:
        error_msg:
          type: string
          example: |
            Body must be valid JSON object in the form of:
              { "parcel_ids": ["valid_uuid_0", "valid_uuid_1", "valid_uuid_N"] }
          description: Error message detailing the required request format.
    Point:
      description: GeoJSON Point
      externalDocs:
        url: https://datatracker.ietf.org/doc/html/rfc7946
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Point
          example: Point
          description: the geometry type
        coordinates:
          $ref: '#/components/schemas/PointCoordinates'
    PlanningApplicationRefs:
      type: array
      items:
        type: object
        required:
          - gss_code
          - refs
        additionalProperties: false
        properties:
          gss_code:
            allOf:
              - $ref: '#/components/schemas/GSSCode'
              - description: The GSS code of a planning authority, e.g. `E09000033`.
              - example: E09000033
          refs:
            type: array
            minItems: 1
            items:
              type: string
              description: >-
                The planning application reference declared by the planning
                authority. It may contain slashes, e.g. `16/11109/FULL`.
              minLength: 1
              example: 16/02592/LBC
    Error:
      type: object
      anyOf:
        - properties:
            error:
              type: string
        - properties:
            error_msg:
              type: string
    PlanningApplication:
      type: object
      properties:
        id:
          type: string
          description: Internal LandTech ID of the planning application.
          example: E09000033+16/02592/LBC
        gss_code:
          allOf:
            - $ref: '#/components/schemas/GSSCode'
            - description: GSS code of the planning authority.
            - example: E09000033
        ref:
          type: string
          description: Reference number used by the planning authority.
          example: 16/02592/LBC
        num_dwellings:
          type: number
          description: >-
            Number of residential units we have identified the application is
            for.
          example: 1
        address:
          type: string
          description: Address of the property the application is for.
          example: Victoria Gate Lodge Hyde Park Bayswater Road London SW7 1NR
        title:
          type: string
          description: Description of the planning application.
          example: >-
            Internal and external alterations of the lodge including general
            internal and external repairs and refurbishment.
        location:
          description: GeoJSON of the location of the planning application, as a point.
          allOf:
            - $ref: '#/components/schemas/Point'
        boundary:
          description: >-
            GeoJSON of the boundary of the planning application, as a
            multipolygon, where available.
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/MultiPolygon'
        url:
          type: string
          nullable: true
          description: >-
            URL to the planning authority's page. Where possible this links
            directly to the planning application.
          example: >-
            https://apps.stratford.gov.uk/eplanning/AppDetail.aspx?appkey=OA70D2PM00E00
        types_derived:
          description: Identified "types" of the application
          type: array
          items:
            type: string
            enum:
              - Full Application
              - Outline
              - Discharge of Conditions
              - GPDR
              - Reserved Matters
              - TPO
              - Listed Building
              - EIA
              - Change of Use
              - Proposal of Application Notice
        status:
          type: string
          nullable: true
          description: Current status of the application, e.g. Decided.
          example: Permission with conditions
        decision:
          type: string
          nullable: true
          description: The decision on the application, e.g. Permit.
          example: Permission with conditions
        date_received:
          type: string
          format: date-time
          description: Date the application was received by the authority.
          example: '2016-07-07T00:00:00.000Z'
        decision_date:
          type: string
          nullable: true
          format: date-time
          description: Date the decision was made on the application.
          example: '2016-09-21T00:00:00.000Z'
        agent_address:
          type: string
          nullable: true
          description: Address of the agent who submitted the application.
          example: The Studio, 42 Placeholder Avenue, Fictiontown-upon-Test, EX4 8MP
        agent_name:
          type: string
          nullable: true
          description: Name of the agent who submitted the application.
          example: Joe Doe
        applicant_name:
          type: string
          nullable: true
          description: Name of the person who submitted the application.
          example: John Smith
        status_derived:
          type: string
          enum:
            - Approved
            - Rejected
            - Pending
            - Withdrawn
            - Unknown
          description: Normalized status of the application.
          example: Approved
        updated:
          type: string
          format: date-time
          description: When the application was last processed by LandTech.
          example: '2023-05-26T03:09:36.191Z'
        classification:
          type: string
          enum:
            - RESIDENTIAL
            - COMMERCIAL
            - MIXED_USE
            - OTHER
          description: Classification of the application.
          example: RESIDENTIAL
        size:
          type: number
          description: Same as num_dwellings.
          example: 1
        found_num_dwellings:
          type: boolean
          description: >-
            Flag stating that we have identified a number of residential units
            (dwellings).
          example: false
        tags:
          description: >-
            A list of "tags" which describe features of the application. Often
            identifies a specific use class, or can be more generic such as
            "Demolition", "Hotel" or "Care Home".
          type: array
          nullable: true
          items:
            type: string
          example:
            - Hotel
            - Demolition
            - Retail (A1)
            - Restaurants and cafés (A3)
            - Office (B1)
        appeal_case_number:
          description: The Planning Inspectorate (PINS) Reference Number
          type: string
          nullable: true
          pattern: ^\d{7}$
          example: '1234567'
        appeal_type_of_appeal:
          description: Appeal type
          type: string
          nullable: true
          example: Planning Appeal
        appeal_type_reason:
          description: >-
            Appeal reason (this field is only populated for certain types of
            appeals)
          type: string
          nullable: true
          example: 1. Refused planning permission
        appeal_application_ref:
          description: >-
            Local Planning Authority application reference number relating to
            the appeal
          type: string
          nullable: true
          example: P1284/13/OUT
        appeal_planning_authority_name:
          description: Local Planning Authority Name, if known
          type: string
          nullable: true
          example: London Borough of Barnet
        appeal_site_address:
          description: Address of the site
          type: string
          nullable: true
          example: The Annex, 7 Example Crescent, Testford-upon-Mere, XY45 6ZT
        appeal_decision:
          description: Appeal decision
          type: string
          nullable: true
          example: Dismissed
        appeal_decision_date:
          description: >-
            If the Jurisdiction is Transferred then it is the date of the
            decision made by the Planning Inspectorate (PINS). If the
            Jurisdiction is Secretary of State then it is the date that the
            report was sent to the Secretary of State
          type: string
          nullable: true
          example: '2017-08-02T00:00:00.000Z'
        appeal_received_date:
          description: Date received in Planning Inspectorate (PINS)
          type: string
          format: date-time
          nullable: true
          example: '2014-05-15T00:00:00.000Z'
        appeal_development_type:
          description: Development type being appealed
          type: string
          nullable: true
          example: Householder developments
        appeal_inspector_name:
          description: Planning Inspector's name, if known
          type: string
          nullable: true
          example: James Smith
        appeal_appellant:
          description: Appellant's name
          type: string
          nullable: true
          example: James Thompson
        appeal_updated_at:
          description: Date the appeal was processed by LandTech
          type: string
          nullable: true
          format: date-time
          example: '2023-05-26T03:09:36.191Z'
        is_full_application:
          type: boolean
          description: Flag indicating "types_derived" includes "Full Application"
          example: false
        is_outline:
          type: boolean
          description: Flag indicating "types_derived" includes "Outline"
          example: false
        is_discharge_of_conditions:
          type: boolean
          description: Flag indicating "types_derived" includes "Discharge of Conditions"
          example: false
        is_gpdr:
          type: boolean
          description: >-
            Flag indicating "types_derived" includes "GPDR" (General Permitted
            Development - Class R)
          example: false
        is_reserved_matters:
          type: boolean
          description: Flag indicating "types_derived" includes "Reserved Matters"
          example: false
        is_tpo:
          type: boolean
          description: >-
            Flag indicating "types_derived" includes "TPO" (Tree Preservation
            Order)
          example: false
        is_listed_building:
          type: boolean
          description: Flag indicating "types_derived" includes "Listed Building"
          example: true
        is_eia:
          type: boolean
          description: >-
            Flag indicating "types_derived" includes "EIA" (Environmental Impact
            Assessment)
          example: false
        is_change_of_use:
          type: boolean
          description: Flag indicating "types_derived" includes "Change of Use"
          example: false
        is_uncategorised:
          type: boolean
          description: >-
            Flag indicating we have been unable to "derive" a "type" (i.e:
            "types_derived" is empty)
          example: false
        is_minor:
          type: boolean
          description: >-
            Flag indicating we have identified the application is a "minor"
            application, i.e. Phone or Post Boxes, Kiosks, ATMs, Advertisements,
            Signage or Lighting.
          example: false
        related_applications:
          allOf:
            - description: Related planning applications
            - $ref: '#/components/schemas/PlanningApplicationRefs'
    Address:
      description: The associated property address. Can be empty.
      type: array
      items:
        type: string
      example:
        - Unipart House, Cowley, Oxford, OX4 2PG
    RegisteredLease:
      description: Details of a registered lease.
      type: object
