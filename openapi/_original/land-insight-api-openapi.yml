      parameters:
        - name: development_constraints_id
          required: true
          in: path
          description: ID for a specific development constraint
          schema:
            $ref: '#/components/schemas/DevelopmentConstraintID'
      responses:
        '200':
          description: Details about a development constraint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevelopmentConstraintFeature'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /additional_opportunities/{additional_opportunities_id}:
    get:
      operationId: getAdditionalOpportunity
      description: >-
        Given an additional opportunity ID, get details about a Homes England
        Land Hub site
      summary: Details about a Homes England Land Hub site
      tags:
        - Additional Opportunities
      parameters:
        - name: additional_opportunities_id
          required: true
          in: path
          description: ID for a specific homes england land hub site
          schema:
            $ref: '#/components/schemas/AdditionalOpportunityID'
      responses:
        '200':
          description: Details about a Homes England Land Hub site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalOpportunityFeature'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /additional_opportunities:
    post:
      operationId: getAdditionalOpportunities
      description: >-
        Given a set of additional opportunity IDs, get details about Homes
        England Land Hub sites in bulk
      summary: Bulk - Details about Homes England Land Hub sites
      tags:
        - Additional Opportunities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  description: List of additional opportunity IDs (max 50)
                  maxItems: 50
                  items:
                    type: string
                    example: 1679c94a-2158-462f-b924-18acf92e7949
      responses:
        '200':
          description: Details about Homes England Land Hub sites
          content:
