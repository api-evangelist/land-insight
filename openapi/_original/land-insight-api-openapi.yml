          nullable: true
          format: date-time
          example: '2008-10-13T00:00:00.000Z'
        company:
          allOf:
            - $ref: '#/components/schemas/Company'
            - $ref: '#/components/schemas/UltimateOwner'
    TitleDetails:
      description: Full details of a land title.
      type: object
      properties:
        data:
          type: object
          properties:
            title:
              type: object
              properties:
                title_no:
                  $ref: '#/components/schemas/TitleNumber'
                tenure:
                  description: The tenure type of the title.
                  type: string
                  enum:
                    - FREEHOLD
                    - LEASEHOLD
                    - UNKNOWN_OTHER
                  example: FREEHOLD
                addresses:
                  $ref: '#/components/schemas/Address'
                registered_lease:
                  $ref: '#/components/schemas/RegisteredLease'
                properties:
                  description: >
                    A list of Unique Property Reference Numbers (UPRNs)
                    formally  associated with the title's land parcel. Can be
                    empty.
                  type: array
                  items:
                    $ref: '#/components/schemas/UPRN'
                  example:
                    - '100080312053'
                properties_intersects:
                  type: array
                  description: >
                    A list of Unique Property Reference Numbers (UPRNs) that
                    reside within  the title's land parcel, but are not formally
                    associated with the title. Can be empty.
                  items:
                    $ref: '#/components/schemas/UPRN'
                  example:
                    - '10091868676'
                    - '10023302495'
                owners:
                  description: A list of registered owners. Can be empty.
                  type: array
                  items:
                    $ref: '#/components/schemas/OwnerDetails'
