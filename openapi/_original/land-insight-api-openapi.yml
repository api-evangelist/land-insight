openapi: 3.0.3
info:
  title: LandTech API
  description: >
    Search for land parcels and retrieve detailed insights on ownership,
    planning applications and property details.
  version: 0.3.0
servers:
  - url: https://app.land.tech/api
    description: LandTech API Service
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Forbidden:
      oneOf:
        - type: object
          required:
            - user
          properties:
            user:
              type: object
              required:
                - state
              properties:
                state:
                  type: string
                  enum:
                    - expired
                    - blocked
                  example: expired
        - type: object
          required:
            - message
          properties:
            message:
              type: string
              example: User not found
    GSSCode:
      type: string
      description: >-
        Geocode as maintained by the United Kingdom's Office for National
        Statistics (ONS) to represent a wide range of geographical areas of the
        UK.
      pattern: ^[EWS]\d{8}$
      example: E09000033
    RegionDetail:
      type: object
      required:
        - gss_code
      properties:
        gss_code:
          allOf:
            - $ref: '#/components/schemas/GSSCode'
            - description: The GSS code of a local authority, e.g. `E06000023`.
            - example: E06000023
        name:
          type: string
          description: The descriptive name of the region.
          example: Bristol, City of
    ParcelSize:
      type: object
      properties:
        min:
          type: number
          format: float
          description: The minimum parcel size in square metres.
          example: 2023.43
        max:
          type: number
          format: float
          description: The maximum parcel size in square metres.
          example: 4046.86
    ParcelTenure:
      type: array
      items:
        type: string
        enum:
          - freehold
          - leasehold
        example: freehold
        default: freehold
    ParcelSearchRequest:
      type: object
      required:
        - region
      properties:
        region:
          allOf:
            - $ref: '#/components/schemas/GSSCode'
            - description: A region code (e.g. GSS code for UK Local Authority Districts).
            - example: E06000023
        parcel_size:
          allOf:
            - $ref: '#/components/schemas/ParcelSize'
            - description: >-
                An optional filter for parcel size in square metres. The max or
                min can be omitted, so for example to find parcels larger than
                1ha (10,000sqm) you can use {"min": 10000}.
        tenure:
          allOf:
            - $ref: '#/components/schemas/ParcelTenure'
          description: >-
            An optional filter for parcel tenures (i.e. freehold or leasehold).
            If omitted, only parcels which include freeholdings will be
            returned. To search for leaseholds, or both, supply ["leasehold"] or
            ["freehold", "leasehold"].
    ParcelId:
      type: string
      format: uuid
      description: A parcel ID in the form of a UUID.
      example: 2a5ad2c7-29ef-d609-8ade-36eef8e3a072
    ParcelIds:
      type: object
      required:
        - parcel_ids
      properties:
        parcel_ids:
          type: array
          description: A list of parcel UUIDs.
          maxItems: 100000
          items:
            $ref: '#/components/schemas/ParcelId'
    AdditionalOpportunities:
      type: object
      title: Additional Opportunities
      properties:
        id:
          type: string
          description: The constant ID for this schema.
          enum:
            - additional-opportunities-id
          example: additional-opportunities-id
        values:
          type: array
          description: >-
            A list of additional opportunities with associated keys and checked
            status.
          items:
            type: object
            required:
              - key
              - checked
            properties:
              key:
                type: string
                description: The key representing the additional opportunity type.
                enum:
                  - declassified_green_belt
                x-enumDescriptions:
                  declassified_green_belt: Declassified Green Belt
                example: declassified_green_belt
              checked:
                type: boolean
                description: >-
                  Indicates whether this additional opportunity type is selected
                  or not.
                enum:
                  - true
                example: true
          example:
            - key: declassified_green_belt
              checked: true
        must:
          type: string
          enum:
            - MATCH_ANY
            - MATCH_NONE
          description: The match type for filtering the additional opportunities options.
          example: MATCH_ANY
      required:
        - values
        - must
        - id
    AgriculturalLandClassification:
      type: object
      title: Agricultural Land Classification
      properties:
        id:
          type: string
          description: The constant ID for this schema.
          enum:
            - agricultural-land-classification-id
          example: agricultural-land-classification-id
        values:
          type: array
          description: >-
            A list of agricultural land classification values with associated
            keys, names, and checked status.
          items:
            type: object
            required:
              - key
            properties:
              key:
                type: string
                description: >-
                  The key representing the agricultural land classification
                  type.
                enum:
                  - grade_1
                  - grade_2
                  - grade_3a
                  - grade_3
                  - grade_3b
                  - grade_4
                  - grade_5
                  - non_agricultural
                x-enumDescriptions:
                  grade_1: Grade 1
                  grade_2: Grade 2
                  grade_3a: Grade 3a
                  grade_3: Grade 3
                  grade_3b: Grade 3b
                  grade_4: Grade 4
                  grade_5: Grade 5
                  non_agricultural: Non Agricultural
                example: grade_1
              checked:
                type: boolean
                description: >-
                  Indicates whether this agricultural land classification type
                  is selected or not.
                example: true
          example:
            - key: grade_1
              checked: true
            - key: grade_3a
              checked: true
        must:
          type: string
          enum:
            - MATCH_ANY
            - MATCH_NONE
          description: >-
            The match type for filtering the agricultural land classification
            options.
          example: MATCH_ANY
      required:
        - values
        - must
        - id
    Transport:
      type: object
      title: Transport
      properties:
        key:
          type: string
          enum:
            - transport
          description: The key representing the transport category.
          example: transport
        checked:
          type: boolean
          description: Indicates whether the transport category is selected.
          example: true
          enum:
            - true
        items:
          type: array
          description: A list of specific transport amenities.
          items:
            type: object
            properties:
              key:
                type: string
                enum:
                  - shortest_distance_bus_stop
                  - shortest_distance_train_station
                  - shortest_distance_metro_station
                x-enumDescriptions:
                  shortest_distance_bus_stop: Shortest distance to bus stop
                  shortest_distance_train_station: Shortest distance to train station
                  shortest_distance_metro_station: Shortest distance to metro station
                description: The key representing the specific transport amenity.
                example: shortest_distance_bus_stop
              checked:
                description: Indicates whether this specific transport amenity is selected.
                example: true
                type: boolean
                enum:
                  - true
          example:
            - key: shortest_distance_bus_stop
              checked: true
            - key: shortest_distance_train_station
              checked: true
      required:
        - key
        - checked
        - items
    Education:
      type: object
      title: Education
      properties:
        key:
          type: string
          enum:
            - education
          description: The key representing the education category.
          example: education
        checked:
          type: boolean
          description: Indicates whether the education category is selected.
          example: true
          enum:
            - true
        items:
          type: array
          description: A list of specific education amenities.
          items:
            type: object
            properties:
              key:
                type: string
                enum:
                  - shortest_distance_primary_school
                  - shortest_distance_secondary_school
                  - shortest_distance_further_education
                  - shortest_distance_primary_school_independent
                  - shortest_distance_secondary_school_independent
                  - shortest_distance_further_education_independent
                x-enumDescriptions:
                  shortest_distance_primary_school: Shortest distance to primary school
                  shortest_distance_secondary_school: Shortest distance to secondary school
                  shortest_distance_further_education: Shortest distance to further education
                  shortest_distance_primary_school_independent: Shortest distance to independent primary school
                  shortest_distance_secondary_school_independent: Shortest distance to independent secondary school
                  shortest_distance_further_education_independent: Shortest distance to independent further education
                description: The key representing the specific education amenity.
                example: shortest_distance_primary_school
              checked:
                description: Indicates whether this specific education amenity is selected.
                example: true
                type: boolean
                enum:
                  - true
          example:
            - key: shortest_distance_primary_school
              checked: true
            - key: shortest_distance_secondary_school
              checked: true
      required:
        - key
        - checked
        - items
    Retail:
      type: object
      title: Retail
      properties:
        key:
          type: string
          enum:
            - retail
          description: The key representing the retail category.
          example: retail
        checked:
          description: Indicates whether the retail category is selected.
          type: boolean
          example: true
          enum:
            - true
        items:
          type: array
          description: A list of specific retail amenities.
          items:
            type: object
            properties:
              key:
                type: string
                enum:
                  - shortest_distance_supermarkets_and_convenience_stores
                x-enumDescriptions:
                  shortest_distance_supermarkets_and_convenience_stores: Shortest distance to supermarkets and convenience stores
                description: The key representing the specific retail amenity.
                example: shortest_distance_supermarkets_and_convenience_stores
              checked:
                description: Indicates whether this specific retail amenity is selected.
                example: true
                type: boolean
                enum:
                  - true
          example:
            - key: shortest_distance_supermarkets_and_convenience_stores
              checked: true
      required:
        - key
        - checked
        - items
    Healthcare:
      type: object
      title: Health Care
      properties:
        key:
          type: string
          enum:
            - healthcare
          description: The key representing the healthcare category.
          example: healthcare
        checked:
          type: boolean
          enum:
            - true
          description: Indicates whether the healthcare category is selected.
          example: true
        items:
          type: array
          minItems: 1
          items:
            type: object
            title: Healthcare - Sub Categories
            properties:
              key:
                type: string
                description: The key representing the specific healthcare amenity.
                enum:
                  - shortest_distance_gp_surgeries
                  - shortest_distance_pharmacies
                  - shortest_distance_clinics
                  - shortest_distance_dentists
                  - shortest_distance_hospitals
                x-enumDescriptions:
                  shortest_distance_gp_surgeries: Shortest distance to GP surgeries
                  shortest_distance_pharmacies: Shortest distance to pharmacies
                  shortest_distance_clinics: Shortest distance to clinics
                  shortest_distance_dentists: Shortest distance to dentists
                  shortest_distance_hospitals: Shortest distance to hospitals
                example: shortest_distance_gp_surgeries
              checked:
                description: >-
                  Indicates whether this specific healthcare amenity is
                  selected.
                type: boolean
                example: true
                enum:
                  - true
            required:
              - key
              - checked
          example:
            - key: shortest_distance_gp_surgeries
              checked: true
            - key: shortest_distance_pharmacies
              checked: true
      required:
        - key
        - checked
        - items
    AmenitiesTypeFilter:
      type: object
      title: Amenities Filter
      properties:
        id:
          type: string
          enum:
            - amenities-type-filter
          example: amenities-type-filter
          description: The unique identifier for the amenities filter.
        values:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/Transport'
              - $ref: '#/components/schemas/Education'
              - $ref: '#/components/schemas/Retail'
              - $ref: '#/components/schemas/Healthcare'
          description: >
            A list of amenities to be filtered. 

            Each item in the list represents a specific amenity type and its
            associated options.
          minItems: 1
          example:
            - key: transport
              checked: true
              items:
                - key: shortest_distance_bus_stop
                  checked: true
            - key: education
              checked: true
              items:
                - key: shortest_distance_primary_school
                  checked: true
        must:
          type: string
          enum:
            - MATCH_ANY
            - MATCH_NONE
          description: The match type for filtering the use class options.
          example: MATCH_ANY
          default: MATCH_ANY
        type:
          type: string
          enum:
            - nested-checkbox
          description: The type of filter, which is always nested-checkbox in this case.
          example: nested-checkbox
          default: nested-checkbox
      required:
        - id
        - values
        - must
        - type
    AmenitiesDistanceFilter:
      type: object
      title: Amenities Distance Filter
      properties:
        id:
          type: string
          enum:
            - amenities-distance-filter
          example: amenities-distance-filter
          description: The unique identifier for the amenities distance filter.
        value:
          type: number
          format: float
          description: The maximum distance for filtering amenities, in meters.
          example: 600
      required:
        - id
        - value
    AmenitiesFilter:
      type: object
      title: Amenities Filter
      properties:
        id:
          type: string
          enum:
            - amenities-filter
          example: amenities-filter
          description: The unique identifier for the amenities filter.
        type:
          type: string
          enum:
            - compound
          example: compound
          description: The type of filter, which is always compound in this case.
        filters:
          type: array
          items:
            minItems: 2
            maxItems: 2
            anyOf:
              - $ref: '#/components/schemas/AmenitiesTypeFilter'
              - $ref: '#/components/schemas/AmenitiesDistanceFilter'
          description: >
            A list of filters to be applied. 

            Must include at least one: AmenitiesTypeFilter and only one
            AmenitiesDistanceFilter.
          example:
            - id: amenities-type-filter
              values:
                - key: transport
                  checked: true
                  items:
                    - key: shortest_distance_bus_stop
                      checked: true
              must: MATCH_ANY
              type: nested-checkbox
            - id: amenities-distance-filter
              value: 200
        must:
          type: string
          enum:
            - MATCH_ALL
            - MATCH_NONE
          description: The match type for combining the filters.
          example: MATCH_ALL
          default: MATCH_ALL
      required:
        - id
        - filters
        - must
        - type
    Article4:
      type: object
      title: Article 4 (London)
      properties:
        id:
          type: string
          description: The constant ID for this schema.
          enum:
            - article-four-id
          example: article-four-id
        values:
          type: array
          description: A list of article 4 values with associated keys, checked status.
          items:
            type: object
            required:
              - key
              - checked
            properties:
              key:
                type: string
                description: The key representing the article 4 type.
                enum:
                  - article_4_ma
                  - article_4_hmo
                  - article_4_other
                  - article_4_unknown
                x-enumDescriptions:
                  article_4_ma: MA
                  article_4_hmo: HMO
                  article_4_other: Other
                  article_4_unknown: Unknown
                example: article_4_hmo
              checked:
                type: boolean
                description: Indicates whether this constraint type is selected or not.
                enum:
                  - true
                example: true
        must:
          type: string
          enum:
            - MATCH_ANY
            - MATCH_NONE
          description: The match type for filtering the article 4 options.
          example: MATCH_NONE
      required:
        - id
        - values
        - must
    CompanyStatus:
      type: object
      title: Company Status
      properties:
        id:
          type: string
          description: The constant ID for this schema.
          enum:
            - company-status-id
          example: company-status-id
        values:
          type: array
          description: >-
            A list of company status types with associated keys and checked
            status.
          items:
            type: object
            required:
              - key
              - checked
            properties:
              key:
                type: string
                description: The key representing the company status type.
                enum:
                  - active
                  - active_proposal_to_strike_off
                  - administration_order
                  - administrative_receiver
                  - in_administration
                  - in_administration_administrative_receiver
                  - in_administration_receiver_manager
                  - liquidation
                  - live_but_receiver_manager_on_at_least_one_charge
                  - receiver_manager_administrative_receiver
                  - receivership
                  - voluntary_arrangement
                  - voluntary_arrangement_administrative_receiver
                  - voluntary_arrangement_receiver_manager
                x-enumDescriptions:
                  active: Active
                  active_proposal_to_strike_off: Active - Proposal To Strike Off
                  administration_order: Administration Order
                  administrative_receiver: Administrative Receiver
                  in_administration: In Administration
                  in_administration_administrative_receiver: In Administration/Administrative Receiver
                  in_administration_receiver_manager: In Administration/Receiver Manager
                  liquidation: Liquidation
                  live_but_receiver_manager_on_at_least_one_charge: Live But Receiver Manager On At Least One Charge
                  receiver_manager_administrative_receiver: Receiver Manager / Administrative Receiver
                  receivership: Receivership
                  voluntary_arrangement: Voluntary Arrangement
                  voluntary_arrangement_administrative_receiver: Voluntary Arrangement / Administrative Receiver
                  voluntary_arrangement_receiver_manager: Voluntary Arrangement / Receiver Manager
                example: active
              checked:
                type: boolean
                description: Indicates whether this company status type is selected or not.
                enum:
                  - true
                example: true
        must:
          type: string
          enum:
            - MATCH_ANY
            - MATCH_NONE
          description: The match type for filtering the company status options.
          example: MATCH_ANY
      required:
        - values
        - must
        - id
    ConstraintsAdopted:
      type: object
      title: Constraints - Adopted Constraints
      properties:
        id:
          type: string
          description: The constant ID for this schema.
          enum:
            - adopted-constraints-id
          example: adopted-constraints-id
        values:
          type: array
          description: A list of constraint values with associated keys, checked status.
          items:
            type: object
            required:
              - key
              - checked
            properties:
              key:
                type: string
                description: The key representing the constraint type.
                enum:
                  - protected_areas_outer
                  - heritage_land_listed_buildings_outer
                  - flood_zone_2_env_agency
                  - flood_zone_3_env_agency
                  - very_low_risk_of_flooding_from_rivers_and_seas
                  - low_risk_of_flooding_from_rivers_and_seas
                  - medium_risk_of_flooding_from_rivers_and_seas
                  - high_risk_of_flooding_from_rivers_and_seas
                  - conservation_areas_outer
                  - employment_area_outer
                  - settlement_boundaries_outer
                  - green_belt_outer
                  - nutrient_neutrality
                  - protected_views_outer
                  - safe_guarding_outer
                  - metropolitan_open_land_outer
                  - open_space_outer
                  - rights_of_way
                  - tree_preservation_orders
                  - national_landscape
                x-enumDescriptions:
                  protected_areas_outer: Protected Areas
                  heritage_land_listed_buildings_outer: Heritage Land/Listed Buildings
                  flood_zone_2_env_agency: Flood Zone 2
                  flood_zone_3_env_agency: Flood Zone 3
                  very_low_risk_of_flooding_from_rivers_and_seas: Very Low Risk (Flood Risk)
                  low_risk_of_flooding_from_rivers_and_seas: Low Risk (Flood Risk)
                  medium_risk_of_flooding_from_rivers_and_seas: Medium Risk (Flood Risk)
                  high_risk_of_flooding_from_rivers_and_seas: High Risk (Flood Risk)
                  conservation_areas_outer: Conservation Areas
                  employment_area_outer: Employment Area
                  settlement_boundaries_outer: Settlement Boundaries
                  green_belt_outer: Green Belt
                  nutrient_neutrality: Nutrient Neutrality
                  protected_views_outer: Protected Views
                  safe_guarding_outer: Safe Guarded Sites
                  metropolitan_open_land_outer: Metropolitan Open Land (Open Land/Green Space)
                  open_space_outer: Open Space (Open Land/Green Space)
                  rights_of_way: Rights of Way
                  tree_preservation_orders: Tree Preservation Orders
                  national_landscape: National Landscape (AONB)
                example: protected_areas_outer
              checked:
                type: boolean
                description: Indicates whether this constraint type is selected or not.
                enum:
                  - true
                example: true
        must:
          type: string
          enum:
            - MATCH_ALL
            - MATCH_NONE
          description: The match type for filtering the constraints options.
          example: MATCH_NONE
      required:
        - values
        - must
        - id
    ConstraintsEmerging:
      type: object
      title: Constraints - Emerging Constraints
      properties:
        id:
          type: string
          description: The constant ID for this schema.
          enum:
            - emerging-constraints-id
          example: emerging-constraints-id
        values:
          type: array
          description: >-
            A list of constraint values with associated keys, checked status,
            and child constraints.
          items:
            type: object
            required:
              - key
              - checked
            properties:
              key:
                type: string
                description: The key representing the constraint type.
                enum:
                  - conservation_areas_outer
                  - employment_area_outer
                  - metropolitan_open_land_outer
                  - open_space_outer
                  - protected_areas_outer
                  - protected_views_outer
                  - safe_guarding_outer
                  - settlement_boundaries_outer
                x-enumDescriptions:
                  conservation_areas_outer: Conservation Areas
                  employment_area_outer: Employment Area
                  metropolitan_open_land_outer: Metropolitan Open Land (Open Land/Green Space)
                  open_space_outer: Open Space (Open Land/Green Space)
                  protected_areas_outer: Protected Areas
                  protected_views_outer: Protected Views
                  safe_guarding_outer: Safe Guarded Sites
                  settlement_boundaries_outer: Settlement Boundaries
                example: conservation_areas_outer
              checked:
                type: boolean
                description: Indicates whether this constraint type is selected or not.
                enum:
                  - true
                example: true
        must:
          type: string
          enum:
            - MATCH_ALL
            - MATCH_NONE
          description: The match type for filtering the constraints options.
          example: MATCH_NONE
      required:
        - values
        - must
        - id
    DevelopedArea:
      type: object
      title: Developed Area
      properties:
        id:
          type: string
          description: The constant ID for this schema.
          enum:
            - developed-area-id
          example: developed-area-id
        range:
          type: array
          description: >
            `[1, 45]` represents a range from **1% to 45%**.


            An array with 2 items that represent the range of percentages for
            the developed area.

            The first item is the minimum value, and the second item is the
            maximum value.
          items:
            type: number
            format: integer
          minItems: 2
          maxItems: 2
          example:
            - 1
            - 45
        rangeType:
          type: string
          description: The type of range being used (e.g., percentage).
          enum:
            - percentage
          example: percentage
      required:
        - id
        - range
        - rangeType
    GreyBeltFavourability:
      type: object
      title: Grey belt favourability
      properties:
        id:
          type: string
          description: The constant ID for this schema.
          enum:
            - grey-belt-type-id
          example: grey-belt-type-id
        values:
          type: array
          description: A list of grey belt land favourability.
          items:
            type: object
            required:
              - key
              - checked
            properties:
              key:
                type: string
                description: The key representing the grey belt land favourability type.
                enum:
                  - grey_belt_land_more_favourable
                  - grey_belt_land_average_favourability
                  - grey_belt_land_less_favourable
                x-enumDescriptions:
                  grey_belt_land_more_favourable: More favourable
                  grey_belt_land_average_favourability: Average favourability
                  grey_belt_land_less_favourable: Less favourable
                example: grey_belt_land_more_favourable
              checked:
                type: boolean
                description: Indicates whether this favourability type is selected or not.
                enum:
                  - true
                example: true
        must:
          type: string
          enum:
            - MATCH_ANY
            - MATCH_NONE
          description: >-
            The match type for filtering the grey belt land favourability
            options.
          example: MATCH_ANY
      required:
        - values
        - must
        - id
    LandAvailabilityAssessment:
      type: object
      title: Land Availability Assessment
      properties:
        id:
          type: string
          description: The constant ID for this schema.
          enum:
            - land-availability-assessment-id
          example: land-availability-assessment-id
        values:
          type: array
          description: >-
            A list of land availability assessment types with associated keys
            and checked status.
          items:
            type: object
            required:
              - key
              - checked
            properties:
              key:
                type: string
                description: The key representing the land availability assessment type.
                enum:
                  - negative
                  - neutral
                  - positive
                x-enumDescriptions:
                  negative: Negative
                  neutral: Neutral
                  positive: Positive
                example: negative
              checked:
                type: boolean
                description: >-
                  Indicates whether this land availability assessment type is
                  selected or not.
                enum:
                  - true
                example: true
        must:
          type: string
          enum:
            - MATCH_ANY
            - MATCH_NONE
          description: >-
            The match type for filtering the land availability assessment
            options.
          example: MATCH_ANY
      required:
        - values
        - must
        - id
    LeaseEndDate:
      type: object
