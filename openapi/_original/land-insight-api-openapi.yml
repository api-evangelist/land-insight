security:
  - ApiKeyAuth: []
tags:
  - name: Getting Started
    description: Endpoints to help you understand how to interact with the API.
  - name: Parcels
    description: Endpoints to search for parcels and associated attributes.
  - name: Ownership
    description: Endpoints to get details about land ownership and property information.
  - name: Planning Applications
    description: >-
      Endpoints to search for planning applications and get details on
      individual applications.
  - name: Local Policy
    description: Endpoint to get details of local plan policies
  - name: Development Constraints
    description: >
      Endpoint to get details of various development constraints. Includes
      airport, HS2, rail and building (wharf)  safeguarding. Also includes
      article 4 and national landscape data.
  - name: Development Opportunities
    description: Endpoint to get details of Named Regeneration Areas and Area Action Plans
  - name: Land Availability Assessment
    description: Endpoint to get details about Land Availability Assessment sites
  - name: Strategic Industrial Location
    description: Endpoint for details on strategic industrial location
  - name: Additional Opportunities
    description: Endpoint to get details of sites from Homes England Land Hub
  - name: Power
    description: Endpoint to get details of substations, lines, cables and towers
  - name: Renewable Energy Planning DB
    description: >-
      Endpoint to get details on sites from the Renewable Energy Planning
      Database
paths:
  /status/auth:
    get:
      operationId: getAuthStatus
      summary: Check your authentication is valid
      description: Responds with the state of your API account.
      tags:
        - Getting Started
      responses:
        '200':
          description: User description.
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    type: object
                    required:
                      - state
                    properties:
                      state:
                        type: string
                        enum:
                          - active
                        example: active
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /regions:
    get:
      operationId: getRegions
      summary: List available regions
      description: >
        List the GSS code and name of known regions (local authorities), that
        can be used when searching for parcels.
      tags:
        - Parcels
      responses:
        '200':
          description: A list of regions available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      regions:
                        type: array
                        items:
                          $ref: '#/components/schemas/RegionDetail'
              examples:
                validResponse:
                  summary: Parcels found
                  value:
                    data:
                      regions:
                        - gss_code: E06000023
                          name: Bristol, City of
                        - gss_code: E09000033
                          name: Westminster
                        - gss_code: E07000112
                          name: Folkestone and Hythe
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /parcels/search:
    post:
      operationId: searchParcels
      summary: Search for parcels
      description: >
        Given a region GSS code and optional parcel size, retrieve a list of
        parcel IDs. The maximum number of IDs returned is 100,000.
      tags:
        - Parcels
      requestBody:
        description: A payload including a region and optional parcel size filters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelSearchRequest'
      responses:
        '200':
          description: A list of parcel IDs matching the search criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelIds'
              examples:
                validResponse:
                  summary: Parcels found
                  value:
                    parcel_ids:
                      - 533bdf35-c073-5433-b225-076b625d22f9
                      - 7da6fe12-6f0a-3d16-5bf0-3c80839256b5
                      - 7fc7684c-bf0f-8710-327e-78d26f9c313e
                emptyResponse:
                  summary: No parcels found
                  value:
                    parcel_ids: []
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /parcels/advanced-search:
    post:
      operationId: searchParcelsAdvanced
      summary: Advanced parcel search - beta
      description: >
        Retrieve a list of parcel IDs based on a set of filters. The maximum
        number of IDs returned is 100,000.
         
        **Schema is subject to change.**
        ![Beta](https://img.shields.io/badge/Status-Beta-yellow)
      tags:
        - Parcels
      requestBody:
        description: A payload including all parcel filters.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParcelSearchRequestAdvanced'
            example:
              search_filter:
                ALL:
                  - id: tenure-uk
                    values:
                      - key: freehold
                        checked: true
                      - key: leasehold
                    must: MATCH_ANY
                  - id: use-class-nested-id
                    values:
                      - key: E
                        items:
                          - key: E(a)
                            checked: true
                          - key: E(b)
                            checked: true
                      - key: sui-generis
                        items:
                          - key: i-Agricultural
                            checked: true
                    must: MATCH_ANY
                  - id: adopted-constraints-id
                    values:
                      - key: very_low_risk_of_flooding_from_rivers_and_seas
                        checked: true
                      - key: low_risk_of_flooding_from_rivers_and_seas
                        checked: true
                    must: MATCH_NONE
                    type: nested-checkbox
                  - id: ownership-type-id
                    values:
                      - key: private
                        checked: true
                    must: MATCH_NONE
      responses:
        '200':
          description: A list of parcel IDs matching the search criteria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelIds'
              examples:
                validResponse:
                  summary: Parcels found
                  value:
                    parcel_ids:
                      - 533bdf35-c073-5433-b225-076b625d22f9
                      - 7da6fe12-6f0a-3d16-5bf0-3c80839256b5
                      - 7fc7684c-bf0f-8710-327e-78d26f9c313e
                emptyResponse:
                  summary: No parcels found
                  value:
                    parcel_ids: []
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /parcels/{parcel_id}:
    get:
      operationId: getParcel
      summary: Details about a parcel
      description: >
        Given a parcel ID, get the parcel details including associated titles,
        properties and planning applications.
      tags:
        - Parcels
      parameters:
        - in: path
          name: parcel_id
          required: true
          schema:
            $ref: '#/components/schemas/ParcelId'
          description: A parcel ID
          example: 2a5ad2c7-29ef-d609-8ade-36eef8e3a072
      responses:
        '200':
          description: Parcel Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParcelDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /parcels:
    post:
      operationId: getParcelsBulk
      summary: Bulk parcel details
      description: |
        Fetch parcel details for up to 50 parcel IDs in a single request.
      tags:
        - Parcels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkParcelRequest'
      responses:
        '200':
          description: Bulk parcel details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkParcelResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkParcelBadRequest'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /planning-applications/search:
    post:
      operationId: searchPlanningApplications
      summary: Search for planning applications
      description: >
        Given a geometry, get a list of planning application references, grouped
        by the planning authority GSS code.
      tags:
        - Planning Applications
      requestBody:
        description: A payload, including a GeoJSON geometry.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                geometry:
                  oneOf:
                    - $ref: '#/components/schemas/Point'
                    - $ref: '#/components/schemas/Polygon'
                    - $ref: '#/components/schemas/MultiPolygon'
      responses:
        '200':
          description: Planning Application Refs
          content:
            application/json:
              schema:
                type: object
                required:
                  - applications
                additionalProperties: false
                properties:
                  applications:
                    $ref: '#/components/schemas/PlanningApplicationRefs'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                errorResponse:
                  value:
                    error: 'Missing required body parameter: ''geometry'''
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /planning-applications/{gss_code}/{ref}:
    get:
      operationId: getPlanningApplication
      summary: Details of a planning application
      description: >
        Get detailed information about a planning application, given its local
        authority GSS code and application reference.
      tags:
        - Planning Applications
      parameters:
        - in: path
          name: gss_code
          required: true
          schema:
            $ref: '#/components/schemas/GSSCode'
          description: The GSS code of a planning authority, e.g. `E09000033`.
          example: E09000033
        - in: path
          name: ref
          required: true
          description: >-
            The planning application reference declared by the planning
            authority. It may contain slashes, e.g. `16/11109/FULL`. It's
            sensible, but not necessary, to "URL encode" this value.
          schema:
            type: string
            minLength: 1
            example: 16%2F11109%2FFULL
      responses:
        '200':
          description: Planning application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningApplication'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                errorResponse:
                  value:
                    error: Planning application not found
  /planning-applications/{app_id}:
    get:
      operationId: getPlanningApplicationById
      summary: Details of a planning application via app ID
      description: >
        Get detailed information about a planning application, given a unique
        planning application ID e.g. a local authority GSS code and reference
        separated by a plus sign (`+`).
      tags:
        - Planning Applications
      parameters:
        - in: path
          name: app_id
          required: true
          description: >
            An ID comprised of a GSS code and ref separated by a plus sign (`+`)
            e.g. `E07000112+Y18/1381/FH`. It's sensible, but not necessary, to
            "URL encode" this value.
          schema:
            $ref: '#/components/schemas/PlanningApplicationId'
          example: E07000112%2BY18%2F1381%2FFH
      responses:
        '200':
          description: Planning application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningApplication'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                errorResponse:
                  value:
                    error: Planning application not found
  /planning-applications:
    post:
      operationId: getPlanningApplicationByIds
      summary: Bulk planning application details
      description: >
        Get detailed information about a set of planning applications, given a
        set of unique planning application IDs e.g. a local authority GSS code
        and reference separated by a plus sign (`+`).
         
        **Schema is subject to change.**
        ![Beta](https://img.shields.io/badge/Status-Beta-yellow)
      tags:
        - Planning Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planning_applications:
                  type: array
                  description: >
                    List of IDs comprised of a GSS code and ref separated by a
                    plus sign (`+`) e.g. `E07000112+Y18/1381/FH`.
                  items:
                    $ref: '#/components/schemas/PlanningApplicationId'
              required:
                - planning_applications
            example:
              planning_applications:
                - E07000112+Y18/1381/FH
                - E09000033+16/02592/LBC
      responses:
        '200':
          description: Planning application details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanningApplication'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                errorResponse:
                  value:
                    error: Planning application not found
  /titles/{title_number}:
    get:
      operationId: getTitleDetails
      summary: Details of a registered title
      description: |
        Get information about a title, given a HM Land Registry title number.
      tags:
        - Ownership
      parameters:
        - in: path
          name: title_number
          required: true
          schema:
            $ref: '#/components/schemas/TitleNumber'
          description: Title number for a parcel of land.
          example: WT77573
      responses:
        '200':
          description: Title details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /titles:
    post:
      operationId: getTitlesBulk
      summary: Bulk title details
      description: |
        Fetch details for up to 200 titles in a single request.
      tags:
        - Ownership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTitleRequest'
      responses:
        '200':
          description: Bulk title details or error response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BulkTitleResponse'
                  - $ref: '#/components/schemas/BulkTitleError'
  /properties/{uprn}:
    get:
      operationId: getPropertyDetails
      summary: Details about a property
      description: >
        Get information about a property, given a Unique Property Reference
        Number (UPRN).
      tags:
        - Ownership
      parameters:
        - in: path
          name: uprn
          required: true
          schema:
            $ref: '#/components/schemas/UPRN'
          description: UPRN for a specific property.
          example: '100010716016'
      responses:
        '200':
          description: Property Information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyInformation'
              examples:
                validResponse:
                  summary: Valid property information
                  value:
                    data:
                      propertyInformation:
                        address:
                          uprn: '100010716016'
                          full_address: 17 Manor Road, Lancashire, Garstang, PR3 1JR
                          property_type: Semi-Detached
                          property_state: In Use
                          property_class_code: RD03
                          use_class: Residential (C3)
                        building_height:
                          highest_point: 3.7
                          roof_height: 1.2
                          no_floors_estimate: 1
                        epc:
                          current_energy_rating: D
                          potential_energy_rating: B
                          total_floor_area: 103.4
                nullResponse:
                  summary: UPRN not found
                  value:
                    data:
                      propertyInformation: null
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: UPRN not supplied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                errorResponse:
                  value:
                    error_msg: route not found
  /properties:
    post:
      operationId: getPropertiesBulk
      summary: Bulk property details
      description: |
        Fetch details for up to 200 properties in a single request.
      tags:
        - Ownership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPropertyRequest'
      responses:
        '200':
          description: Bulk property details or error response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BulkPropertyResponse'
                  - $ref: '#/components/schemas/BulkPropertyError'
  /shlaa/{shlaa_id}:
    get:
      operationId: getShlaa
      description: >-
        Given an ID, get details about an individual Land Availability
        Assessment
      summary: Details about an individual SHLAA
      tags:
        - Land Availability Assessment
      parameters:
        - name: shlaa_id
          required: true
          in: path
          description: ID for a specific Land Availability Assessment
          schema:
            $ref: '#/components/schemas/ShlaaID'
      responses:
        '200':
          description: Details about a Land Availability Assessments site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShlaaFeature'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
  /development_constraints/{development_constraints_id}:
    get:
      operationId: getDevelopmentConstraint
      description: >-
