    SearchLocation:
      type: object
      title: Search Location
      properties:
        id:
          type: string
          example: search-location-id
          enum:
            - search-location-id
          description: The unique identifier for the search location filter.
        location:
          description: >
            ## Polygon:


            A GeoJSON polygon.


            Polygon is defined by one or more linear rings.

            The first ring represents the outer boundary (shell), and any
            additional rings represent holes (interior boundaries).

            Each ring is a closed line made up of an array of at least four
            coordinate pairs,

            where the first and last positions are identical to close the shape.


            Coordinates follow the format `[longitude, latitude]`.

            A Polygon must not intersect itself and must follow the right-hand
            rule for winding order.


            ---


            ### Useful links:

            - [GeoJSON
            Specification](https://datatracker.ietf.org/doc/html/rfc7946#section-3.1.6)

            - [GeoJSON.io - Online Tool](https://geojson.io/)


            ---



            ### Simple Polygon Example:


            ```
              {
                "coordinates": [
                  [
                    [-0.14929038118364701, 51.536142527775894],
                    [-0.1511502946380574, 51.536606841918456],
                    [-0.15158046405704795, 51.53662282512096],
                    [-0.15314734138883068, 51.53638304796348],
                    [-0.15551325060320664, 51.5358605395725],
                    [-0.15853824326276822, 51.535146678003656],
                    [-0.16127849793295468, 51.53438900786796],
                    [-0.1629081211282255, 51.533737304067245],
                    [-0.16433232531409203, 51.532317284173246],
                    [-0.16515124173966456, 51.53147677320297],
                    [-0.16517750702064404, 51.530486405978394],
                    [-0.16470453397198526, 51.52968949678419],
                    [-0.16419787377387252, 51.52924454958466],
                    [-0.16160535022888212, 51.52759132355445],
                    [-0.15956874947798383, 51.52617575757168],
                    [-0.15845578053699683, 51.52486257411584],
                    [-0.15534964384988825, 51.52369876908375],
                    [-0.145932851559877, 51.525347514462425],
                    [-0.1459570444773135, 51.52897366493096],
                    [-0.1460084744027199, 51.53010860617948],
                    [-0.14805040702364636, 51.53477548344256],
                    [-0.1484858923158754, 51.53564562001867],
                    [-0.14929038118364701, 51.536142527775894]
                  ]
                ],
                "type": "Polygon"
              }
            ```


            ---


            ### Polygon including a hole:

            ```
              {
                "coordinates": [
                  [
                    [-0.14929038118364701, 51.536142527775894],
                    [-0.1511502946380574, 51.536606841918456],
                    [-0.15158046405704795, 51.53662282512096],
                    [-0.15314734138883068, 51.53638304796348],
                    [-0.15551325060320664, 51.5358605395725],
                    [-0.15853824326276822, 51.535146678003656],
                    [-0.16127849793295468, 51.53438900786796],
                    [-0.1629081211282255, 51.533737304067245],
                    [-0.16433232531409203, 51.532317284173246],
                    [-0.16515124173966456, 51.53147677320297],
                    [-0.16517750702064404, 51.530486405978394],
                    [-0.16470453397198526, 51.52968949678419],
                    [-0.16419787377387252, 51.52924454958466],
                    [-0.16160535022888212, 51.52759132355445],
                    [-0.15956874947798383, 51.52617575757168],
                    [-0.15845578053699683, 51.52486257411584],
                    [-0.15534964384988825, 51.52369876908375],
                    [-0.145932851559877, 51.525347514462425],
                    [-0.1459570444773135, 51.52897366493096],
                    [-0.1460084744027199, 51.53010860617948],
                    [-0.14805040702364636, 51.53477548344256],
                    [-0.1484858923158754, 51.53564562001867],
                    [-0.14929038118364701, 51.536142527775894]
                  ],
                  [
                    [-0.1528028809015325, 51.52903093393792],
                    [-0.15190063187328917, 51.52866837902546],
                    [-0.15133992236366112, 51.52809880224876],
                    [-0.15122810383141427, 51.527513054250775],
                    [-0.15152242033633456, 51.52697809355044],
                    [-0.1520289119160907, 51.52648937141588],
                    [-0.15293715205308445, 51.52626119797495],
                    [-0.15374870651484684, 51.526168806088194],
                    [-0.15455587449918085, 51.526286175974064],
                    [-0.15575918093998098, 51.527008428928156],
                    [-0.1560404186055564, 51.52770737376511],
                    [-0.15562500260159595, 51.52840462735193],
                    [-0.15509228496867422, 51.528778327054],
                    [-0.15410266542014028, 51.52909488998242],
                    [-0.1533836641634707, 51.529096986799686],
                    [-0.1528028809015325, 51.52903093393792]
                  ]
                ],
                "type": "Polygon"
              }
            ```


            ---


            ## Point with Radius:

            A GeoJSON point with a radius in metres.


            Coordinates follow the format `[longitude, latitude]`.


            ### Example of a Point with Radius:


            ```
              {
                "coordinates": [-0.081547, 51.521412],
                "radius_metres": 100,
                "type": "Point"
              }
            ```
          oneOf:
            - $ref: '#/components/schemas/Polygon'
            - $ref: '#/components/schemas/PointWithRadius'
