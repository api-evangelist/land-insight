    PropertyInformation:
      type: object
      properties:
        data:
          type: object
          properties:
            propertyInformation:
              type: object
              nullable: true
              description: >-
                Property Information details. Will be `null` if no data is
                found.
              properties:
                address:
                  type: object
                  properties:
                    uprn:
                      allOf:
                        - $ref: '#/components/schemas/UPRN'
                        - description: The UPRN of the property, e.g. `100010716016`.
                        - example: '100010716016'
                    full_address:
                      type: string
                      description: The full address of the property.
                      example: 29 Acacia Road, Nuttytown, B4 4NA
                    property_type:
                      type: string
                      description: The type of property (e.g. Residential).
                      example: Shop / Showroom
                    property_state:
                      type: string
                      nullable: true
                      description: The current state of the property (e.g. In Use).
                      enum:
                        - Demolished
                        - In Use
                        - Planning Permission Granted
                        - Under Construction
                        - Unoccupied/Vacant/Derelict
                      example: In Use
                    property_class_code:
                      type: string
                      description: >-
                        The Ordnance Survey classification code of the property
                        (e.g. RD03).
                      example: RD03
                    use_class:
                      type: string
                      nullable: true
                      description: The use class of the property (e.g. Residential (C3)).
                      example: Residential (C3)
                building_height:
                  type: object
                  nullable: true
                  properties:
                    highest_point:
                      type: number
                      format: float
                      nullable: true
                      description: The highest point of the building in meters.
                      example: 6.4
                    roof_height:
                      type: number
                      format: float
                      nullable: true
                      description: The roof height of the building in meters.
                      example: 6.1
                    no_floors_estimate:
                      type: integer
                      nullable: true
                      description: The estimated number of floors in the building.
                      example: 1
                epc:
                  type: object
                  nullable: false
                  properties:
                    current_energy_rating:
                      type: string
                      nullable: true
                      description: The energy rating given in the most recent EPC
                      example: C
                    potential_energy_rating:
                      type: string
                      nullable: true
                      description: >
                        The potential energy rating that could be achievable in
                        the property as listed by the EPC
                      example: B
                    total_floor_area:
                      type: number
                      format: float
                      nullable: true
                      description: The floor area as listed on the EPC in square metres
                      example: 160.23
