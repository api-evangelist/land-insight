openapi: 3.2.0
info:
  title: LandTech Getting Started API
  description: Search for land parcels and retrieve detailed insights on ownership, planning applications and property details.
  version: 0.3.0
servers:
- url: https://app.land.tech/api
  description: LandTech API Service
security:
- ApiKeyAuth: []
tags:
- name: Getting Started
  description: Endpoints to help you understand how to interact with the API.
paths:
  /status/auth:
    get:
      operationId: getAuthStatus
      summary: Check your authentication is valid
      description: Responds with the state of your API account.
      tags:
      - Getting Started
      responses:
        '200':
          description: User description.
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                properties:
                  user:
                    type: object
                    required:
                    - state
                    properties:
                      state:
                        type: string
                        enum:
                        - active
                        example: active
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
components:
  schemas:
    Forbidden:
      oneOf:
      - type: object
        required:
        - user
        properties:
          user:
            type: object
            required:
            - state
            properties:
              state:
                type: string
                enum:
                - expired
                - blocked
                example: expired
      - type: object
        required:
        - message
        properties:
          message:
            type: string
            example: User not found
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
x-provenance:
  method: harvested
  publisher: Land Insight
  source: https://developers.land.tech/_spec/openapi.yaml?download
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
