aid: land-insight
name: Land Insight
description: >-
  LandTech (land.tech) is a UK property technology company whose LandInsight platform is used by
  developers, land agents, planners and investors to source and assess development sites. It combines
  HM Land Registry ownership and title data, planning applications, local plan policy, development
  constraints (Green Belt, flood zones, Article 4 directions, heritage designations), Land Availability
  Assessments, brownfield and regeneration opportunities, EPC and property attributes, and electricity
  network / renewable energy infrastructure into a single map-based product. Alongside LandInsight the
  company ships LandFund for development finance appraisal and Give My View for community engagement.
  The LandTech API exposes the same UK land and planning datasets as a paid HTTP product so customers
  can feed parcel search, ownership, planning application and constraint data into their own internal
  or customer-facing systems.
